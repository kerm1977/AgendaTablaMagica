<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ea580c">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<title>Divisas</title>
<style>
/* ==========================================================================
   Sistema de diseño idéntico a TABLAMÁGICA (Gestión de Pagos JyK):
   mismas variables, reset, contenedores, formularios y botones.
   ========================================================================== */
:root {
    /* Colores base: paleta Agenda Tribu */
    --color-primario: #f97316;
    --color-primario-oscuro: #ea580c;
    --color-secundario: #dee2e6;
    --color-fondo: #f0f2f5;
    --color-texto: #111b21;
    --color-acento: #fb923c;
    --color-exito: #198754;
    --color-error: #dc3545;
    --color-blanco: #ffffff;
    --sombra-suave: 0 4px 8px rgba(0, 0, 0, 0.1);
    --borde-radio: 12px;
}

/* --- Paleta de Temas --- */
.theme-sepia { --color-primario: #f97316; --color-primario-oscuro: #ea580c; --color-secundario: #dee2e6; --color-fondo: #f0f2f5; --color-texto: #111b21; --color-acento: #fb923c; --color-blanco: #ffffff; --color-exito: #198754; --color-error: #dc3545; }
.theme-dark { --color-primario: #fb923c; --color-primario-oscuro: #ea580c; --color-secundario: #333333; --color-fondo: #121212; --color-texto: #e0e0e0; --color-acento: #f97316; --color-blanco: #1e1e1e; --color-exito: #4ade80; --color-error: #f87171; }

/* Placeholders Modo Dark */
.theme-dark input::placeholder,
.theme-dark textarea::placeholder {
    color: #b0bec5;
    opacity: 1;
}

/* Reseteo y Estilos Base */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
body { background-color: var(--color-fondo); color: var(--color-texto); transition: background-color 0.3s, color 0.3s; line-height: 1.6; padding-top: 60px; overflow-x: hidden; }

/* Header superior estilo Agenda Tribu */
.app-header {
    position: fixed; top: 0; left: 0; right: 0;
    background-color: var(--color-primario-oscuro); color: white;
    z-index: 1030; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    height: 60px; display: flex; align-items: center;
    justify-content: center; padding: 0 15px; text-align: center;
}
.app-header h5 { width: 100%; margin: 0; font-weight: bold; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

/* Contenedores y Layout */
.container{max-width:1200px;margin:20px auto;padding:20px}
.content-section{background-color:var(--color-blanco);padding:1.5rem;border-radius:var(--borde-radio);margin-bottom:1.5rem}
.section-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--color-secundario);padding-bottom:1rem;margin-bottom:1rem;flex-wrap:wrap; gap: 10px;}
.section-title { color: var(--color-primario); margin: 0; }

/* Formularios y Botones */
.form-group{margin-bottom:1.5rem;position:relative}.form-group label{display:block;margin-bottom:.5rem;font-weight:600}.form-group input,.form-group select,.form-group textarea{width:100%;padding:.8rem;border:1px solid var(--color-secundario);border-radius:8px;background-color:var(--color-fondo);color:var(--color-texto);transition:border-color .3s}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--color-acento)}

.btn{padding:.8rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-weight:600;margin-top:.5rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;}
.btn-primary{background-color:var(--color-primario);color:var(--color-blanco)}
.btn-secondary{background-color:var(--color-secundario);color:var(--color-texto)}
.btn-acento{background-color:var(--color-acento);color:var(--color-texto)}
.btn-exito{background-color:var(--color-exito);color:var(--color-blanco)}
.btn-error{background-color:var(--color-error);color:var(--color-blanco)}

/* ==========================================================================
   ARCHIVO: media-fx.css
   RESPONSABILIDAD: calculadora de divisas (media/fx.js) — misma lógica,
     apariencia calcada de Gestión de Pagos JyK.
   ========================================================================== */
.tribal-fx { display: none; }
.tribal-fx.on { display: block; }

/* banda de referencia: tipo de cambio del dólar (referencia vs API) */
.fx-ref {
    margin: 0 0 1rem; padding: 0.8rem 1rem;
    background-color: var(--color-fondo);
    border: 1px solid var(--color-secundario);
    border-radius: var(--borde-radio); font-size: 0.9rem;
    color: var(--color-texto);
}
.fx-ref b { color: var(--color-primario); font-size: 1rem; }
.fx-ref small { display: block; margin-top: 2px; font-size: 0.75rem; opacity: 0.8; }

/* monto + dropdown de la moneda origen — mismos campos que el resto de la app */
.fx-search {
    display: grid; gap: 1rem; margin-bottom: 0.5rem;
    grid-template-columns: 1fr;
}
@media (min-width: 768px) { .fx-search { grid-template-columns: 1fr 1fr; } }
.fx-search .form-group { margin-bottom: 0; }
.fx-amt { font-weight: 700; }

.fx-status {
    margin: 0.5rem 0 0; font-size: 0.8rem;
    color: var(--color-texto); opacity: 0.75; font-style: italic;
}

.fx-list { display: flex; flex-direction: column; }

.fx-row {
    display: flex; align-items: center; gap: 10px;
    padding: 0.9rem 0.25rem;
}
.fx-row + .fx-row { border-top: 1px solid var(--color-secundario); }
.fx-flag { font-size: 1.4rem; flex: 0 0 auto; }
.fx-rtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fx-rtxt b {
    font-size: 1.1rem; color: var(--color-exito);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fx-rtxt small {
    font-size: 0.75rem; color: var(--color-texto); opacity: 0.8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* tasa como texto plano (se vuelve campo solo al tocarla) */
.fx-rtext {
    flex: 0 0 auto; font-size: 0.75rem; white-space: nowrap;
    color: var(--color-primario); cursor: pointer;
    border-bottom: 1px dashed var(--color-acento);
}
.fx-rate-edit {
    width: 96px; padding: 4px 6px; font-size: 0.85rem; text-align: right;
    background-color: var(--color-fondo); color: var(--color-texto);
    border: 1px solid var(--color-acento); border-radius: 8px;
    outline: none;
}

.fx-foot {
    margin-top: 1rem; padding-top: 1rem;
    border-top: 1px solid var(--color-secundario);
    font-size: 0.75rem; color: var(--color-texto); opacity: 0.7;
    text-align: center;
}

@media (max-width: 768px) {
    .container { margin: 10px auto; padding: 10px; }
    .section-header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    .section-header .btn { width: 100%; }
}
</style></head><body class="theme-sepia">
<header class="app-header"><h5>Calculadora de Divisas</h5></header>
<script>
/* stub TribalState — persiste monto/moneda solo por sesión */
window.TribalState=(function(){var s={};return{opened:function(){},
closed:function(){},get:function(k,d){return(k in s)?s[k]:d},
save:function(k,v){s[k]=v}}})();
</script>
<script>// ============================================================================
// ARCHIVO: media/fxdata.js
// RESPONSABILIDAD: datos de la calculadora de divisas — catálogo de monedas,
//   tasas por defecto, carga/guardado en localStorage y utilidades de formato.
//   API: TribalFXData.LIST · .load() → {rates, api, stamp} · .persist(obj)
//        · .esc(s) · .fmt(v) · .find(code)
// ============================================================================
window.TribalFXData = (function () {
    'use strict';

    var LIST = [
        { code: 'USD', sym: '$',   flag: '🇺🇸', name: 'dólares (EE. UU.)' },
        { code: 'CRC', sym: '₡',   flag: '🇨🇷', name: 'colones (Costa Rica)' },
        { code: 'GTQ', sym: 'Q',   flag: '🇬🇹', name: 'quetzales (Guatemala)' },
        { code: 'SVC', sym: '₡',   flag: '🇸🇻', name: 'colones (El Salvador)' },
        { code: 'HNL', sym: 'L',   flag: '🇭🇳', name: 'lempiras (Honduras)' },
        { code: 'NIO', sym: 'C$',  flag: '🇳🇮', name: 'córdobas (Nicaragua)' },
        { code: 'PAB', sym: 'B/.', flag: '🇵🇦', name: 'balboas (Panamá)' },
        { code: 'BZD', sym: 'BZ$', flag: '🇧🇿', name: 'dólares (Belice)' },
        { code: 'MXN', sym: '$',   flag: '🇲🇽', name: 'pesos (México)' },
        { code: 'PEN', sym: 'S/',  flag: '🇵🇪', name: 'soles (Perú)' },
        { code: 'COP', sym: '$',   flag: '🇨🇴', name: 'pesos (Colombia)' },
        { code: 'EUR', sym: '€',   flag: '🇪🇸', name: 'euros (España)' }
    ];
    var DEF = { USD: 1, CRC: 505, GTQ: 7.72, SVC: 8.75, HNL: 26.3, NIO: 36.8,
                PAB: 1, BZD: 2, MXN: 18.2, PEN: 3.75, COP: 4200, EUR: 0.92 };
    var KEY = 'tribal-fx-rates';

    function load() {
        var st = { rates: {}, api: {}, stamp: null };
        try {
            var s = JSON.parse(localStorage.getItem(KEY) || 'null');
            if (s && s.rates) { st.rates = s.rates; st.api = s.api || {}; st.stamp = s.stamp; }
        } catch (e) { /* corrupto → defaults */ }
        LIST.forEach(function (c) {
            if (!(st.rates[c.code] > 0)) st.rates[c.code] = DEF[c.code];
        });
        st.rates.USD = 1;
        return st;
    }
    function persist(st) {
        try {
            localStorage.setItem(KEY, JSON.stringify(
                { rates: st.rates, api: st.api, stamp: st.stamp }));
        } catch (e) { /* solo sesión */ }
    }
    function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }
    function fmt(v) {
        return v.toLocaleString('es-CR', { minimumFractionDigits: 2,
                                           maximumFractionDigits: 2 });
    }
    function find(code) {
        for (var i = 0; i < LIST.length; i++) if (LIST[i].code === code) return LIST[i];
        return LIST[0];
    }

    return { LIST: LIST, load: load, persist: persist,
             esc: esc, fmt: fmt, find: find };
})();
</script>
<script>// ============================================================================
// ARCHIVO: media/fxnet.js
// RESPONSABILIDAD: Traer las tasas de cambio en línea (base USD).
//   Fuente: open.er-api.com — gratuito, sin llave, cubre todas las monedas
//   necesarias. El API oficial del BCCR (indicadores económicos) exige un
//   token registrado por correo; sin credenciales no se puede consultar —
//   queda como opción futura si el usuario registra su token.
//   Sin conexión → cb(err) y el módulo sigue con tasas manuales.
//   API: TribalFXNet.fetch(cb) → cb(err, { rates, stamp })
// ============================================================================
window.TribalFXNet = (function () {
    'use strict';

    var URL = 'https://open.er-api.com/v6/latest/USD';

    function fetch(cb) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', URL, true);
        xhr.timeout = 8000;
        xhr.onload = function () {
            if (xhr.status !== 200) return cb(new Error('HTTP ' + xhr.status));
            try {
                var d = JSON.parse(xhr.responseText);
                if (!d || d.result !== 'success' || !d.rates) {
                    return cb(new Error('respuesta inválida'));
                }
                cb(null, {
                    rates: d.rates,
                    stamp: d.time_last_update_utc || d.time_last_update || 'en línea'
                });
            } catch (e) { cb(e); }
        };
        xhr.onerror = function () { cb(new Error('red')); };
        xhr.ontimeout = function () { cb(new Error('timeout')); };
        xhr.send();
    }

    return { fetch: fetch };
})();
</script>
<script>// ============================================================================
// ARCHIVO: media/fx.js
// RESPONSABILIDAD: Calculadora de divisas — página completa, base USD,
//   con la apariencia de Gestión de Pagos JyK (container/content-section,
//   form-group, btn-primary).
//   · Banda de referencia arriba: "tipo de cambio del dólar" en TEXTO PLANO
//     (tasa de referencia + la de open.er-api.com, para comparar)
//   · Monto + dropdown de la moneda origen
//   · Lista de conversiones; la tasa de cada fila también es texto plano
//   · Ajuste manual: TOCAR una tasa la vuelve editable solo en ese momento
//   Datos/persistencia en media/fxdata.js · red en media/fxnet.js
//   API: TribalFX.open() / TribalFX.hide()
// ============================================================================
window.TribalFX = (function () {
    'use strict';

    var D = window.TribalFXData;
    var LIST, esc, fmt, find, persist;
    var ov, amtEl, selEl, listEl, statusEl, refEl;
    var st; // { rates, api, stamp }

    function boot() {
        if (st) return;
        LIST = D.LIST; esc = D.esc; fmt = D.fmt; find = D.find; persist = D.persist;
        st = D.load();
    }
    // moneda de referencia para la banda del dólar (si el origen es USD → CRC)
    function refCode() {
        var c = selEl ? selEl.value : 'USD';
        return c === 'USD' ? 'CRC' : c;
    }
    function paintStatus(t) { if (statusEl) statusEl.textContent = t; }
    function stampText() {
        return st.stamp ? ('fuente: open.er-api.com · ' + st.stamp)
                        : 'tasas manuales — toca una tasa para ajustarla';
    }

    // banda superior: tipo de cambio del dólar (referencia vs API) — texto
    function paintRef() {
        var c = find(refCode()), api = st.api[c.code];
        refEl.innerHTML = 'Tipo de cambio del dólar · ' +
            '<b class="fx-rtext" data-c="' + c.code + '" ' +
            'title="Toca para ajustar a mano">1 USD = ' + st.rates[c.code] +
            ' ' + c.sym + '</b>' + (api && api !== st.rates[c.code] ?
            ' <small>open.er-api.com: ' + api + ' ' + c.sym + '</small>' : '');
    }

    function rowHtml(c, a, code, usd) {
        var eq = usd == null ? '—' : fmt(usd * st.rates[c.code]);
        var label = isFinite(a) ? fmt(a) + ' ' + code + ' en ' + c.name
                                : 'monto en ' + c.name;
        return '<div class="fx-row" data-c="' + c.code + '">' +
            '<span class="fx-flag">' + c.flag + '</span>' +
            '<div class="fx-rtxt"><b>' + eq + ' ' + c.sym + '</b>' +
            '<small>' + esc(label) + '</small></div>' +
            '<span class="fx-rtext" data-c="' + c.code + '" ' +
            'title="Toca para ajustar a mano">1 USD = ' + st.rates[c.code] +
            ' ' + c.sym + '</span></div>';
    }
    function renderList() {
        var a = parseFloat(amtEl.value), code = selEl.value;
        var usd = (isFinite(a) && st.rates[code] > 0) ? a / st.rates[code] : null;
        var html = '';
        LIST.forEach(function (c) {
            if (c.code !== code) html += rowHtml(c, a, code, usd);
        });
        listEl.innerHTML = html;
        paintRef();
    }
    function reamount() {
        var a = parseFloat(amtEl.value), code = selEl.value;
        var usd = (isFinite(a) && st.rates[code] > 0) ? a / st.rates[code] : null;
        listEl.querySelectorAll('.fx-row').forEach(function (row) {
            var c = find(row.getAttribute('data-c'));
            row.querySelector('b').textContent =
                (usd == null ? '—' : fmt(usd * st.rates[c.code])) + ' ' + c.sym;
        });
    }

    // tocar una tasa (texto plano) la vuelve campo SOLO mientras se edita
    function startEdit(code, holder) {
        var inp = document.createElement('input'), done = false;
        inp.type = 'number'; inp.step = 'any'; inp.min = '0';
        inp.className = 'fx-rate-edit'; inp.value = st.rates[code];
        holder.parentNode.replaceChild(inp, holder);
        inp.focus(); inp.select();
        function end(ok) {
            if (done) return;
            done = true;
            var v = parseFloat(inp.value);
            if (ok && v > 0) {
                st.rates[code] = v; persist(st);
                paintStatus('tasa ' + code + ' ajustada a mano');
            }
            renderList();
        }
        inp.addEventListener('keydown', function (e) {
            e.stopPropagation();
            if (e.key === 'Enter') end(true);
            else if (e.key === 'Escape') end(false);
        });
        inp.addEventListener('blur', function () { end(true); });
    }

    function onInput(e) {
        if (e.target === amtEl || e.target === selEl) {
            renderList();
            // anti-crash: el último monto/moneda se conserva
            if (window.TribalState) TribalState.save('fxdata',
                { a: amtEl.value, f: selEl.value });
        }
    }
    function onClick(e) {
        if (e.target.closest('.fx-fetch')) return fetchRates();
        var rt = e.target.closest('.fx-rtext');
        if (rt) startEdit(rt.getAttribute('data-c'), rt);
    }

    function fetchRates() {
        if (!window.TribalFXNet) return paintStatus('módulo de red ausente');
        paintStatus('consultando open.er-api.com…');
        TribalFXNet.fetch(function (err, res) {
            if (err) return paintStatus('sin conexión — tasas manuales');
            st.api = res.rates; st.stamp = res.stamp || 'en línea';
            var n = 0;
            LIST.forEach(function (c) {
                var v = res.rates[c.code];
                if (v > 0 && c.code !== 'USD') { st.rates[c.code] = v; n++; }
            });
            persist(st); renderList();
            paintStatus(stampText() + ' · ' + n + ' actualizadas');
        });
    }

    function build() {
        if (ov) return;
        ov = document.createElement('div');
        ov.className = 'tribal-fx';
        var opts = LIST.map(function (c) {
            return '<option value="' + c.code + '">' + c.flag + ' ' + c.code +
                   ' — ' + esc(c.name) + '</option>';
        }).join('');
        ov.innerHTML =
            '<div class="container">' +
            '<div class="content-section">' +
            '<div class="section-header">' +
            '<h3 class="section-title">Calculadora de Divisas</h3>' +
            '<button type="button" class="btn btn-primary fx-fetch">' +
            '<i class="fas fa-rotate-right"></i> Actualizar</button>' +
            '</div>' +
            '<div class="fx-ref"></div>' +
            '<div class="fx-search">' +
            '<div class="form-group"><label for="fx-amt">Monto</label>' +
            '<input type="number" step="any" id="fx-amt" class="fx-amt" ' +
            'inputmode="decimal" placeholder="0.00"></div>' +
            '<div class="form-group"><label for="fx-sel">Moneda origen</label>' +
            '<select id="fx-sel" class="fx-sel">' + opts + '</select></div>' +
            '</div>' +
            '<div class="fx-status"></div>' +
            '</div>' +
            '<div class="content-section">' +
            '<div class="section-header">' +
            '<h3 class="section-title">Conversiones</h3></div>' +
            '<div class="fx-list"></div>' +
            '<div class="fx-foot">Base USD · toca una tasa para ajustarla ' +
            'a mano · ↻ trae open.er-api.com</div>' +
            '</div>' +
            '</div>';
        document.body.appendChild(ov);
        amtEl = ov.querySelector('.fx-amt');
        selEl = ov.querySelector('.fx-sel');
        listEl = ov.querySelector('.fx-list');
        statusEl = ov.querySelector('.fx-status');
        refEl = ov.querySelector('.fx-ref');
        ov.addEventListener('input', onInput);
        ov.addEventListener('change', onInput);
        ov.addEventListener('click', onClick);
    }

    function open() {
        boot(); build();
        var last = window.TribalState ? TribalState.get('fxdata', null) : null;
        selEl.value = (last && last.f) || 'USD';
        if (last && last.a) amtEl.value = last.a;
        renderList();
        paintStatus(stampText());
        ov.classList.add('on');
        if (window.TribalState) TribalState.opened('fx');
    }
    function hide() {
        if (ov) ov.classList.remove('on');
        if (window.TribalState) TribalState.closed('fx');
    }

    return { open: open, hide: hide };
})();
</script>
<script>
/* página única: abrir y quedarse — hide() no la cierra nunca */
(function(){window.TribalFX.open();
window.TribalFX.hide=function(){};})();
</script>
