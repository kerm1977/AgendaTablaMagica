  <div class="modal fade" id="modalPorReconocer" tabindex="-1" aria-hidden="true">

            <option value="camino">Camino de Costa Rica</option>
            <option value="parques">Parques Nacionales</option>
            <option value="reserva">Reserva Biológica</option>
            <option value="bosque">Bosque Nuboso</option>
            <option value="finca">Finca</option>
            <option value="caminata">Caminata</option>
            <option value="cataratas">Cataratas</option>

        </div>
        <div class="mb-2" id="contenedorNombre">
          <label class="form-label">Nombre del lugar</label>

            <option>Cartago</option>
            <option>Heredia</option>
            <option>Alajuela</option>
            <option>Guanacaste</option>
            <option>Puntarenas</option>
            <option>Limón</option>

        </div>
        <div class="mb-2">
          <label class="form-label">Fecha de reconocimiento</label>
          <div class="row g-2">
            <div class="col-4">
              <select class="form-select" name="recDia" id="fRecDia" onchange="verificarFeriadoCampo('fRec')" required>
                <option value="" disabled selected>Día</option>
              </select>
            </div>
            <div class="col-4">
              <select class="form-select" name="recMes" id="fRecMes" onchange="actualizarDias('reconocer'); verificarFeriadoCampo('fRec')" required>
                <option value="" disabled selected>Mes</option>
              </select>
            </div>
            <div class="col-4">
              <select class="form-select" name="recAnio" id="fRecAnio" onchange="actualizarDias('reconocer'); verificarFeriadoCampo('fRec')" required>
                <option value="" disabled selected>Año</option>
              </select>
            </div>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label">¿Tienes fecha de la caminata?</label>

            <option value="si">Sí</option>
          </select>
        </div>
        <div id="contenedorFechaCaminata" class="d-none">
          <div class="mb-2">
            <label class="form-label">Fecha de caminata</label>
            <div class="row g-2">
              <div class="col-4">
                <select class="form-select" name="camDia" id="fCamDia" onchange="verificarFeriadoCampo('fCam'); mostrarPrecioBuseta()">
                  <option value="" disabled selected>Día</option>
                </select>
              </div>
              <div class="col-4">
                <select class="form-select" name="camMes" id="fCamMes" onchange="actualizarDias('caminata'); verificarFeriadoCampo('fCam'); mostrarPrecioBuseta()">

                </select>
              </div>
              <div class="col-4">
                <select class="form-select" name="camAnio" id="fCamAnio" onchange="actualizarDias('caminata'); verificarFeriadoCampo('fCam'); mostrarPrecioBuseta()">

                </select>
              </div>

          <div class="mb-2 d-none" id="contenedorBuseta">

            <input type="number" step="0.01" min="0" class="form-control" name="precioBuseta" id="inputPrecioBuseta" placeholder="Ej: 150000">

        </div>
        <div class="mb-2">
          <label class="form-label">Tipo de ruta</label>

        </div>
        <div id="contenedorEnlaces" class="mb-2"></div>
        <div class="mb-2">

        <div class="mb-2">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" name="descripcion" rows="3" placeholder="Detalles adicionales del lugar"></textarea>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">Dificultad</label>
            <select class="form-select" name="dificultad">
              <option value="" disabled selected>...</option>
              <option>Baja</option>
              <option>Media</option>
              <option>Alta</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Kilometraje</label>
            <input type="number" step="0.1" min="0" class="form-control" name="kilometraje" placeholder="km">
          </div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">¿Apto para invierno?</label>

              <option value="" disabled selected>Seleccione...</option>

            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Tipo de terreno</label>
            <select class="form-select" name="terreno">
              <option value="" disabled selected>Seleccione...</option>
              <option value="Lastre">Lastre</option>
              <option value="Sendero">Sendero</option>

            </select>
          </div>
        </div>
        <button class="btn btn-danger w-100" type="submit">Guardar lugar por reconocer</button>
      </form>
          </div>
        </div>

    <div class="modal fade" id="modalYaConocido" tabindex="-1" aria-hidden="true">

            <option>Heredia</option>
            <option>Alajuela</option>
            <option>Guanacaste</option>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">Dificultad</label>
            <select class="form-select" name="dificultad" required>
              <option value="" disabled selected>...</option>
              <option>Baja</option>
              <option>Media</option>
              <option>Alta</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Kilometraje</label>
            <input type="number" step="0.1" min="0" class="form-control" name="kilometraje" required>
          </div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">¿Apto para invierno?</label>
            <select class="form-select" name="invierno" required>
              <option value="" disabled selected>Seleccione...</option>
              <option value="Si">Sí</option>
              <option value="No">No</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Tipo de terreno</label>
            <select class="form-select" name="terreno" required>
              <option value="" disabled selected>Seleccione...</option>
              <option value="Lastre">Lastre</option>
              <option value="Sendero">Sendero</option>
              <option value="Pavimento">Pavimento</option>
            </select>
          </div>
        </div>
        <button class="btn btn-danger w-100" type="submit">Guardar lugar ya conocido</button>
      </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LS_KEY = 'agendaTribuLibres';
    const DB_NAME = 'tribuLibresDb', STORE_NAME = 'datos', DB_KEY = 'agenda';
    let datos = { reconocer: [], conocidos: [] };
    let fuente = 16;
    let itemActual = null;
    let editandoId = null;
    let pasoEliminar = 1;
    let db = null;

    const FERIADOS_FIJOS = [
      { mes: 1, dia: 1, nombre: 'Año Nuevo' },
      { mes: 4, dia: 11, nombre: 'Día de Juan Santamaría' },
      { mes: 5, dia: 1, nombre: 'Día del Trabajador' },
      { mes: 7, dia: 25, nombre: 'Anexión de Guanacaste' },
      { mes: 8, dia: 2, nombre: 'Día de la Virgen de los Ángeles' },
      { mes: 8, dia: 15, nombre: 'Día de la Madre' },
      { mes: 9, dia: 15, nombre: 'Día de la Independencia' },
      { mes: 12, dia: 25, nombre: 'Navidad' }
    ];

    const DIAS_SEMANA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    const ACTIVIDAD_LABELS = { camino: 'Camino de Costa Rica', parques: 'Parques Nacionales', reserva: 'Reserva Biológica', bosque: 'Bosque Nuboso', finca: 'Finca', caminata: 'Caminata', cataratas: 'Cataratas', cerros: 'Cerros' };

    const PROVINCIAS_CR = ['San José', 'Cartago', 'Heredia', 'Alajuela', 'Guanacaste', 'Puntarenas', 'Limón'];

    const ETAPAS_CAMINO = ['Etapa 1a', 'Etapa 1b', 'Etapa 2', 'Etapa 3', 'Etapa 4', 'Etapa 5', 'Etapa 6', 'Etapa 7', 'Etapa 8', 'Etapa 9', 'Etapa 10', 'Etapa 11', 'Etapa 12', 'Etapa 13', 'Etapa 14', 'Etapa 15', 'Etapa 16'];

    const PARQUES_NACIONALES = [
      { nombre: 'Parque Nacional Volcán Arenal', provincias: ['Alajuela'] },
      { nombre: 'Parque Nacional Barbilla', provincias: ['Limón', 'Cartago'] },
      { nombre: 'Parque Nacional Barra Honda', provincias: ['Guanacaste'] },
      { nombre: 'Parque Nacional Braulio Carrillo', provincias: ['San José', 'Heredia', 'Limón'] },
      { nombre: 'Parque Nacional Cahuita', provincias: ['Limón'] },
      { nombre: 'Parque Nacional Carara', provincias: ['Puntarenas'] },
      { nombre: 'Parque Nacional Chirripó', provincias: ['San José', 'Limón'] },
      { nombre: 'Parque Nacional Corcovado', provincias: ['Puntarenas'] },
      { nombre: 'Parque Nacional Diriá', provincias: ['Guanacaste'] },
      { nombre: 'Parque Nacional Guanacaste', provincias: ['Guanacaste'] },
      { nombre: 'Parque Nacional Volcán Irazú', provincias: ['Cartago'] },
      { nombre: 'Parque Nacional Isla del Coco', provincias: ['Puntarenas'] },
      { nombre: 'Parque Nacional Juan Castro Blanco', provincias: ['Alajuela'] },
      { nombre: 'Parque Nacional La Cangreja', provincias: ['Puntarenas'] },
      { nombre: 'Parque Nacional Marino Las Baulas', provincias: ['Guanacaste'] },
      { nombre: 'Parque Nacional Marino Ballena', provincias: ['Puntarenas'] },
      { nombre: 'Parque Nacional Los Quetzales', provincias: ['San José', 'Cartago'] },
      { nombre: 'Parque Nacional Manuel Antonio', provincias: ['Puntarenas'] },
      { nombre: 'Parque Nacional Palo Verde', provincias: ['Guanacaste'] },
      { nombre: 'Parque Nacional Piedras Blancas', provincias: ['Puntarenas'] },
      { nombre: 'Parque Nacional Volcán Poás', provincias: ['Alajuela', 'Heredia'] },
      { nombre: 'Parque Nacional Rincón de la Vieja', provincias: ['Guanacaste', 'Alajuela'] },
      { nombre: 'Parque Nacional Santa Rosa', provincias: ['Guanacaste'] },
      { nombre: 'Parque Nacional Tapantí-Macizo de la Muerte', provincias: ['Cartago'] },
      { nombre: 'Parque Nacional Volcán Tenorio', provincias: ['Alajuela', 'Guanacaste'] },
      { nombre: 'Parque Nacional Tortuguero', provincias: ['Limón'] },
      { nombre: 'Parque Nacional Volcán Turrialba', provincias: ['Cartago'] }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      // Integracion: si AgendaTribuPro importo datos, sincronizarlos
      try {
        const sharedAgenda = localStorage.getItem('agendaDatos');
        if (sharedAgenda) {
          const parsed = JSON.parse(sharedAgenda);
          if (parsed && parsed.reconocer && parsed.conocidos) {
            datos = parsed;
          }
        }
      } catch (e) { console.error('Error leyendo agendaDatos compartidos', e); }
      cargarDatosAsync().then(() => {
        inicializarFechas();
        renderizarFeriados();
        notificarDatosAParent();
      });
      document.getElementById('modalPorReconocer').addEventListener('hidden.bs.modal', () => {
        editandoId = null;
        document.getElementById('formReconocer').reset();
        inicializarFechas();
        actualizarEnlacesRuta('');
        actualizarCamposActividad('');
        document.getElementById('tituloModalPorReconocer').textContent = 'Registrar lugar por reconocer';
      });
      document.getElementById('modalYaConocido').addEventListener('hidden.bs.modal', () => {
        editandoId = null;
        document.getElementById('formConocidos').reset();
        document.getElementById('tituloModalYaConocido').textContent = 'Registrar lugar ya conocido';
      });
    });

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'getAgendaDatos') {
        const hoy = new Date();
        const anioFin = 2030;
        const feriados = [];
        for (let a = hoy.getFullYear(); a <= anioFin; a++) {
          feriados.push(...obtenerFeriados(a, a));
        }
        const payload = {
          reconocer: (datos && datos.reconocer) ? datos.reconocer : [],
          conocidos: (datos && datos.conocidos) ? datos.conocidos : [],
          feriados: feriados.map(f => ({ nombre: f.nombre, fecha: formatearFecha(f.fecha) }))
        };
        event.source.postMessage({ type: 'agendaDatos', payload: payload }, '*');
      }
    });
    renderizarFeriados();
  </script>
